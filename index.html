<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シフトボード</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-screen desk tool. The board is a ruled sheet like a printed 勤務表; the store name and section titles are set in mincho,
   controls in gothic, every number in mono. Squared corners, thin rules, 藍 for actions and 朱 only for things that need attention. */
:root{
  --bg:#e8eae6; --paper:#fbfbf9; --paper2:#f1f2ee; --paper3:#e7e9e5;
  --ink:#1b1f22; --ink2:#434b4f; --muted:#6d7579;
  --rule:#c6ccc8; --rule2:#dde1dd;
  --ai:#24456e; --ai-fg:#ffffff; --ai-soft:#e3eaf3;
  --shu:#b4402a; --shu-soft:#f5e2dd;
  --ok:#2d6a48; --ok-soft:#dfebe2; --warn:#8a6210; --warn-soft:#f2e9cf;
  --today:#f6efd6; --sat:#2b5a9c; --sun:#b4402a; --off:#8a9195;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --mono:"IBM Plex Mono","Consolas","Menlo",monospace;
  --r:3px; --shadow:0 12px 36px rgba(20,26,30,.22);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141719; --paper:#1d2124; --paper2:#242a2d; --paper3:#2c3336;
  --ink:#e5e7e3; --ink2:#bcc2be; --muted:#8e979a;
  --rule:#3a4246; --rule2:#2c3336;
  --ai:#86abdc; --ai-fg:#0c1a2b; --ai-soft:#20303f;
  --shu:#e2735c; --shu-soft:#3c2420;
  --ok:#6fbf90; --ok-soft:#1a3327; --warn:#d8a84a; --warn-soft:#3a2f14;
  --today:#2d2a1b; --sat:#88b0e4; --sun:#e2735c; --off:#79828a;
  --shadow:0 12px 36px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141719; --paper:#1d2124; --paper2:#242a2d; --paper3:#2c3336;
  --ink:#e5e7e3; --ink2:#bcc2be; --muted:#8e979a;
  --rule:#3a4246; --rule2:#2c3336;
  --ai:#86abdc; --ai-fg:#0c1a2b; --ai-soft:#20303f;
  --shu:#e2735c; --shu-soft:#3c2420;
  --ok:#6fbf90; --ok-soft:#1a3327; --warn:#d8a84a; --warn-soft:#3a2f14;
  --today:#2d2a1b; --sat:#88b0e4; --sun:#e2735c; --off:#79828a;
  --shadow:0 12px 36px rgba(0,0,0,.6); color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column;min-height:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.r{text-align:right}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:0 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;padding:10px 0}
.brand h1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;line-height:1.2}
.tag{font-size:11px;letter-spacing:.06em;padding:1px 6px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;border-radius:2px}
.tag.on{color:var(--ok);border-color:var(--ok)}
.tag.ro{color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;gap:0;align-self:stretch;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:14px 11px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ai)}
.tabs .cnt{font-family:var(--mono);font-size:11px;background:var(--shu);color:#fff;padding:0 5px;border-radius:2px;line-height:1.5}
.period{display:flex;align-items:center;gap:6px;margin-left:auto;padding:8px 0}
.period .lbl{font-weight:700;font-size:15px;min-width:11em;text-align:center;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:6px 11px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink);line-height:1.3}
.btn:hover{background:var(--paper2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ai);color:var(--ai-fg);border-color:var(--ai)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--shu)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.icon{padding:6px 8px}
.btn.ghost{border-color:transparent;background:transparent}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}

main{flex:1;min-height:0;overflow:auto;padding:14px 16px 28px}
.view{display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
.notice{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:8px 12px;font-size:13px;border-radius:var(--r)}
.notice.shu{border-color:var(--shu);background:var(--shu-soft)}
.notice.ai{border-color:var(--ai);background:var(--ai-soft)}

/* board tables */
.sheet-wrap{overflow:auto;border:1px solid var(--rule);background:var(--paper);max-height:calc(100% - 4px)}
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
table.board th,table.board td{border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);padding:0;vertical-align:top;text-align:left}
table.board thead th{position:sticky;top:0;background:var(--paper);z-index:3;border-bottom:1px solid var(--rule)}
table.board th.who,table.board th.corner{position:sticky;left:0;background:var(--paper);z-index:2;min-width:150px;width:150px;border-right:1px solid var(--rule)}
table.board thead th.corner{z-index:4}
table.board th.day{padding:8px 10px;min-width:118px}
.day .dnum{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.day .dwd{font-size:12px;color:var(--muted)}
.day.sat .dnum,.day.sat .dwd{color:var(--sat)}
.day.sun .dnum,.day.sun .dwd,.day.hol .dnum,.day.hol .dwd{color:var(--sun)}
.day .hol{font-size:11px;color:var(--sun)}
.day.today .dnum{text-decoration:underline;text-decoration-color:var(--ai);text-decoration-thickness:3px;text-underline-offset:4px}
td.today-col{background:var(--today)}
td.wk{background:var(--paper2)}
tr.need th,tr.need td{background:var(--paper2);font-size:12px;padding:5px 8px}
tr.need th{font-weight:500;color:var(--muted)}
.needchip{display:inline-flex;align-items:center;gap:4px;margin:1px 4px 1px 0;padding:0 5px;border-radius:2px;border:1px solid var(--rule);font-variant-numeric:tabular-nums;background:var(--paper);font-family:var(--mono);font-size:11px}
.needchip i{width:8px;height:8px;border-radius:1px;background:var(--c)}
.needchip.bad{border-color:var(--shu);color:var(--shu);background:var(--shu-soft)}
.needchip.ok{color:var(--ok)}
.needchip.dim{opacity:.5}
th.who{padding:8px 10px;font-weight:500}
th.who .nm{display:flex;align-items:center;gap:7px}
th.who .dot{width:9px;height:9px;border-radius:1px;background:var(--c);flex:none}
th.who small{display:block;color:var(--muted);font-size:11px;margin-left:16px}
td.cell{min-height:54px;height:54px;padding:4px;cursor:cell;transition:background .12s}
td.cell:hover{background:var(--ai-soft)}
td.cell.dragover{outline:2px dashed var(--ai);outline-offset:-3px}
td.cell.unavail{background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule2) 6px 7px)}
td.sum{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
td.sum small{color:var(--muted)}
td.sum.over{color:var(--shu);font-weight:700}
tr.total th,tr.total td{background:var(--paper2);font-size:12px;padding:6px 10px;color:var(--muted)}
tr.total td b{color:var(--ink);font-size:13px;font-family:var(--mono)}
.chip{display:flex;align-items:center;gap:5px;background:var(--c);color:#fff;border-radius:2px;padding:3px 7px;font-size:12px;font-weight:500;line-height:1.3;cursor:grab;margin-bottom:3px;position:relative;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.chip .t{font-family:var(--mono);font-size:11px;opacity:.92;white-space:nowrap}
.chip.off{background:transparent;color:var(--muted);border:1.5px dashed var(--off);cursor:grab;box-shadow:none}
.chip.custom{--c:#5b6b7c}
.chip.req{background:transparent;color:var(--ai);border:1.5px dotted var(--ai);box-shadow:none;cursor:pointer}
.chip .w{margin-left:auto;background:var(--warn);color:#1a1200;border-radius:2px;font-size:10px;font-weight:700;width:16px;height:16px;display:grid;place-items:center;flex:none}
.chip:active{cursor:grabbing}

/* month */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);overflow:hidden}
.month .mh{background:var(--paper2);padding:6px;text-align:center;font-size:12px;color:var(--muted);font-weight:500}
.month .mh.sat{color:var(--sat)}.month .mh.sun{color:var(--sun)}
.mday{background:var(--paper);min-height:110px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mday:hover{background:var(--ai-soft)}
.mday.out{opacity:.45}
.mday.today{background:var(--today)}
.mday.wk{background:var(--paper2)}
.mday .dh{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.mday .dh b{font-family:var(--display);font-size:16px}
.mday.sat .dh b{color:var(--sat)}.mday.sun .dh b,.mday.hol .dh b{color:var(--sun)}
.mday .dh small{font-size:10px;color:var(--sun);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mday .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--mono)}
.mday .cnt.bad{color:var(--shu);font-weight:700}
.mchip{font-size:11px;padding:1px 5px;border-left:3px solid var(--c);background:var(--paper2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.off{border-left-style:dashed;color:var(--muted)}
.mchip .t{color:var(--muted);font-family:var(--mono);font-size:10px}
.mmore{font-size:11px;color:var(--muted)}

/* day timeline */
.tl{border:1px solid var(--rule);background:var(--paper);overflow:auto}
.tl-grid{min-width:800px}
.tl-row{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid var(--rule2)}
.tl-row.head{position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:1px solid var(--rule)}
.tl-who{padding:8px 10px;border-right:1px solid var(--rule);display:flex;align-items:center;gap:7px;font-weight:500}
.tl-who .dot{width:9px;height:9px;border-radius:1px;background:var(--c)}
.tl-track{position:relative;height:46px;background-image:repeating-linear-gradient(90deg,var(--rule2) 0 1px,transparent 1px calc(100%/var(--n)));cursor:cell}
.tl-track:hover{background-color:var(--ai-soft)}
.tl-hours{display:grid;grid-template-columns:repeat(var(--n),1fr);font-size:11px;color:var(--muted);font-family:var(--mono)}
.tl-hours span{padding:6px 0 6px 4px;border-left:1px solid var(--rule2)}
.tl-bar{position:absolute;top:8px;height:30px;border-radius:2px;background:var(--c);color:#fff;font-size:12px;padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.tl-bar.off{background:transparent;border:1.5px dashed var(--off);color:var(--muted);box-shadow:none}
.tl-bar .t{font-family:var(--mono);font-size:11px;opacity:.9}
.tl-bar .w{background:var(--warn);color:#1a1200;border-radius:2px;font-size:10px;font-weight:700;width:16px;height:16px;display:grid;place-items:center}
.tl-cov{display:grid;grid-template-columns:repeat(var(--n),1fr);height:60px;align-items:end}
.tl-cov div{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;border-left:1px solid var(--rule2);font-size:11px;font-family:var(--mono);color:var(--muted)}
.tl-cov div i{display:block;width:70%;background:var(--ai);opacity:.7}
.tl-cov div.zero i{background:var(--shu)}

/* panels, forms */
.panel{background:var(--paper);border:1px solid var(--rule);padding:14px 16px}
.panel h2{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--rule2);letter-spacing:.02em}
.panel h2 .sub{font-family:var(--font);font-weight:400;font-size:12px;color:var(--muted);margin-left:10px;letter-spacing:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:6px 8px;min-width:0;width:100%}
.field input[type=time],.field input[type=number],.field input[type=date],.field input[type=month],.field input.num{font-family:var(--mono)}
.field input[type=color]{padding:2px;height:34px;width:48px}
.chk{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;user-select:none}
.chk input{margin:0}
.chk.sat{color:var(--sat)}.chk.sun{color:var(--sun)}
.tplbtn{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.tplbtn i{width:10px;height:10px;border-radius:1px;background:var(--c)}
.tplbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.hint{font-size:12px;color:var(--muted)}
.empty{border:1px dashed var(--rule);padding:28px 20px;text-align:center;background:var(--paper);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-family:var(--display);font-size:17px}
.empty p{margin:0;max-width:34em;color:var(--muted)}
.staff-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.scard{background:var(--paper);border:1px solid var(--rule);padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.scard .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.scard .nm small{font-weight:400;color:var(--muted);font-size:12px}
.scard .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.scard .wd{display:flex;gap:2px}
.scard .wd span{width:20px;height:20px;border-radius:2px;display:grid;place-items:center;font-size:11px;background:var(--paper2);color:var(--muted)}
.scard .wd span.on{background:var(--ai-soft);color:var(--ai);font-weight:700}
table.list{border-collapse:collapse;width:100%}
table.list th,table.list td{padding:6px 8px;border-bottom:1px solid var(--rule2);text-align:left;white-space:nowrap;vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--rule)}
table.list td.r,table.list th.r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
table.list tr.tot td{font-weight:700;border-top:2px solid var(--rule)}
table.list input.cellin{width:90px;text-align:right;border:1px solid var(--rule);border-radius:2px;padding:3px 5px;font-family:var(--mono);background:var(--paper)}
.warnlist{display:flex;flex-direction:column;gap:4px}
.warnlist div{padding:5px 8px;border-left:3px solid var(--warn);background:var(--warn-soft);font-size:13px}
.warnlist div.under{border-color:var(--shu);background:var(--shu-soft)}
.sumline{display:flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule)}
.sumline div{padding:10px 16px;border-right:1px solid var(--rule2);display:flex;flex-direction:column;gap:2px;min-width:140px;flex:1}
.sumline div:last-child{border-right:0}
.sumline .k{font-size:12px;color:var(--muted)}
.sumline .v{font-size:20px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.2}
.sumline .v small{font-size:12px;font-family:var(--font);font-weight:400;color:var(--muted)}
.sumline .bad .v{color:var(--shu)}
table.req{border-collapse:collapse}
table.req th,table.req td{border:1px solid var(--rule2);padding:4px 6px;text-align:center}
table.req input{width:52px;text-align:center;border:1px solid var(--rule);border-radius:2px;padding:3px;font-family:var(--mono);background:var(--paper)}
table.req th.sat{color:var(--sat)}table.req th.sun{color:var(--sun)}
.tplrow{display:grid;grid-template-columns:40px 1fr 100px 100px 80px 36px;gap:6px;align-items:center}
.tplrow input{border:1px solid var(--rule);border-radius:2px;padding:5px 6px;background:var(--paper);min-width:0;width:100%}
.tplrow input[type=color]{padding:1px;height:32px}
.tplrow input[type=time],.tplrow input[type=number]{font-family:var(--mono)}
.tplhead{font-size:11px;color:var(--muted)}
details.fold{border:1px solid var(--rule);background:var(--paper)}
details.fold summary{cursor:pointer;padding:10px 16px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::before{content:"▸";color:var(--muted);font-size:12px}
details.fold[open] summary::before{content:"▾"}
details.fold summary::-webkit-details-marker{display:none}
details.fold .body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule2)}

/* requests */
.reqgroup{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);background:var(--paper)}
.reqgroup .gh{padding:8px 12px;background:var(--paper2);font-weight:500;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule2)}
.reqrow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule2)}
.reqrow:last-child{border-bottom:0}
.reqrow .who{display:flex;align-items:center;gap:7px;font-weight:500}
.reqrow .who .dot{width:9px;height:9px;border-radius:1px;background:var(--c);flex:none}
.reqrow .what{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-width:0}
.reqrow .what .note{color:var(--muted);font-size:12px}
.kind{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:2px;font-size:12px;border:1px solid var(--rule)}
.kind.off{border-style:dashed;color:var(--muted)}
.kind.work{border-color:var(--c);color:var(--c)}
.kind.conf{border-color:var(--shu);color:var(--shu);background:var(--shu-soft)}
.st{font-size:11px;padding:1px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--muted)}
.st.pending{border-color:var(--ai);color:var(--ai)}
.st.approved{border-color:var(--ok);color:var(--ok)}
.st.rejected{border-color:var(--rule);color:var(--muted);text-decoration:line-through}
@media (max-width:760px){.reqrow{grid-template-columns:1fr;gap:6px}}

/* submit (staff) */
.submit-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.submit-head h2{font-family:var(--display);font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.mgrid .mh{background:var(--paper2);padding:5px;text-align:center;font-size:12px;color:var(--muted)}
.mgrid .mh.sat{color:var(--sat)}.mgrid .mh.sun{color:var(--sun)}
.sday{background:var(--paper);min-height:78px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.sday:hover{background:var(--ai-soft)}
.sday.out{opacity:.35;cursor:default}
.sday.past{opacity:.55;cursor:default;background:var(--paper2)}
.sday.today{background:var(--today)}
.sday .d{font-family:var(--display);font-size:15px;font-weight:700;display:flex;gap:6px;align-items:baseline}
.sday .d small{font-family:var(--font);font-weight:400;font-size:10px;color:var(--sun);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sday.sat .d{color:var(--sat)}.sday.sun .d,.sday.hol .d{color:var(--sun)}
.sday .fixed{font-size:11px;padding:1px 5px;border-left:3px solid var(--c);background:var(--paper2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sday .fixed.off{border-left-style:dashed;color:var(--muted)}
.sday .mine{font-size:11px;padding:1px 5px;border:1.5px dotted var(--ai);color:var(--ai);border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sday .mine.approved{border-style:solid;background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.sday .mine.rejected{border-style:solid;color:var(--muted);text-decoration:line-through;border-color:var(--rule)}
@media (max-width:760px){.sday{min-height:58px;padding:3px 4px}.sday .fixed,.sday .mine{font-size:10px;padding:0 3px}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}

/* payroll */
.payhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.payhead .per{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.acct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.acct.none{color:var(--shu);font-family:var(--font)}
.paid{color:var(--ok);font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(14,18,22,.5);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sheet.wide{width:min(760px,100%)}
.sheet h2{font-family:var(--display);font-size:17px;font-weight:700}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.sheet .foot .left{margin-right:auto}
.sheet textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-radius:var(--r);padding:8px;background:var(--paper2)}
.sheet h3{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin-top:4px;padding-bottom:4px;border-bottom:1px solid var(--rule2)}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);animation:up .2s ease-out}
.toast.bad{background:var(--shu);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}td.cell{transition:none}}
.ro-bar{background:var(--warn-soft);color:var(--ink);padding:6px 16px;font-size:13px;text-align:center;border-bottom:1px solid var(--warn)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:0 4px;background:var(--paper2)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pick button{border:1px solid var(--rule);background:var(--paper);padding:10px 12px;text-align:left;display:flex;align-items:center;gap:8px;border-radius:var(--r)}
.pick button:hover{background:var(--ai-soft)}
.pick button:disabled{opacity:.5;cursor:default}
.pick .dot{width:10px;height:10px;border-radius:1px;background:var(--c)}
.pick small{display:block;color:var(--muted);font-size:11px}

@media (max-width:760px){
  .top{padding:0 12px;gap:4px 12px}
  .brand{padding:8px 0}
  .brand h1{max-width:52vw;font-size:17px}
  .tabs{order:3;width:100%;margin:0 -12px;padding:0 12px}
  .tabs button{padding:10px 9px 9px;font-size:13px}
  .period{margin-left:0;width:100%;justify-content:center;order:4;padding:6px 0}
  .period .lbl{min-width:0;flex:1}
  .actions{order:5;padding:0 0 8px}
  main{padding:10px 16px 20px}
  .mday{min-height:64px;padding:4px}
  .mchip,.mmore{display:none}
}

// ---------- analysis ----------
function analyze(from, to) {
  const st = settings(); const res = { shift: {}, under: {}, staffWeek: {} };
  const note = (id, m) => { (res.shift[id] || (res.shift[id] = [])).push(m); };
  const lo = fmtD(addD(parseD(from), -7)), hi = fmtD(addD(parseD(to), 7));
  const all = Object.values(S.shifts).filter(s => s.date >= lo && s.date <= hi && S.staff[s.staffId]);
  const byStaff = {}; all.forEach(s => { (byStaff[s.staffId] || (byStaff[s.staffId] = [])).push(s); });
  for (const sid in byStaff) {
    const p = S.staff[sid]; const list = byStaff[sid].sort((a, b) => absStart(a) - absStart(b));
    const offDates = new Set(list.filter(s => s.kind === 'off').map(s => s.date));
    const work = list.filter(s => s.kind === 'work');
    work.forEach(s => { if (offDates.has(s.date)) note(s.id, '希望休の日に勤務'); if (p.avail && p.avail[parseD(s.date).getDay()] === false) note(s.id, '出勤できない曜日'); });
    for (let i = 0; i < work.length - 1; i++) {
      const a = work[i], b = work[i + 1]; const gap = absStart(b) - absEnd(a);
      if (gap < 0) { note(a.id, '時間が重複'); note(b.id, '時間が重複'); }
      else if (gap < st.minRest * 60) note(b.id, `前の勤務との間隔 ${fmtH(gap / 60)}h（${st.minRest}h 必要）`);
    }
    const wk = {}; work.forEach(s => { const k = fmtD(startOfWeek(parseD(s.date), st.weekStart)); wk[k] = (wk[k] || 0) + hours(s); });
    res.staffWeek[sid] = wk;
    if (p.maxHours > 0) work.forEach(s => { const k = fmtD(startOfWeek(parseD(s.date), st.weekStart)); if (wk[k] > p.maxHours + 1e-9) note(s.id, `週 ${fmtH(wk[k])}h（上限 ${p.maxHours}h）`); });
    const days = [...new Set(work.map(s => s.date))].sort(); let run = 0, prev = null;
    days.forEach(d => { run = (prev && dayIdx(d) === dayIdx(prev) + 1) ? run + 1 : 1; prev = d; if (run > st.maxConsecutive) work.filter(s => s.date === d).forEach(s => note(s.id, `${run}連勤`)); });
  }
  for (let d = parseD(from); fmtD(d) <= to; d = addD(d, 1)) {
    const ds = fmtD(d); const need = st.required[d.getDay()] || {}; const u = res.under[ds] = {};
    st.templates.forEach(t => { u[t.id] = { need: need[t.id] || 0, have: all.filter(s => s.kind === 'work' && s.date === ds && s.tpl === t.id).length }; });
  }
  return res;
}
function autoAssignPlan(from, to) {
  const st = settings(); const staff = staffList(); const ops = []; let unfilled = 0;
  const lo = fmtD(addD(parseD(from), -7)), hi = fmtD(addD(parseD(to), 7));
  const pool = Object.values(S.shifts).filter(s => s.date >= lo && s.date <= hi);
  const has = (sid, ds) => pool.some(s => s.staffId === sid && s.date === ds);
  const weekKey = ds => fmtD(startOfWeek(parseD(ds), st.weekStart));
  const weekH = (sid, ds) => { const k = weekKey(ds); return pool.filter(s => s.staffId === sid && s.kind === 'work' && weekKey(s.date) === k).reduce((a, s) => a + hours(s), 0); };
  const restOk = (sid, ds, t) => { const di = dayIdx(ds), a = di * 1440 + t.start, b = di * 1440 + t.end; return pool.filter(s => s.staffId === sid && s.kind === 'work' && Math.abs(dayIdx(s.date) - di) <= 1).every(s => (a - absEnd(s) >= st.minRest * 60) || (absStart(s) - b >= st.minRest * 60)); };
  const consecOk = (sid, ds) => { const di = dayIdx(ds); const w = new Set(pool.filter(s => s.staffId === sid && s.kind === 'work').map(s => dayIdx(s.date))); let n = 1; for (let i = di - 1; w.has(i); i--) n++; for (let i = di + 1; w.has(i); i++) n++; return n <= st.maxConsecutive; };
  const pendingOff = (sid, ds) => Object.values(S.requests).some(r => r.staffId === sid && Object.values(r.items || {}).some(it => it.date === ds && it.kind === 'off' && it.status === 'pending'));
  for (let d = parseD(from); fmtD(d) <= to; d = addD(d, 1)) {
    const ds = fmtD(d), wd = d.getDay(); const need = st.required[wd] || {};
    for (const t of st.templates) {
      const n = need[t.id] || 0; let have = pool.filter(s => s.kind === 'work' && s.date === ds && s.tpl === t.id).length; const th = (t.end - t.start - t.brk) / 60;
      while (have < n) {
        const cands = staff.filter(p => (!p.avail || p.avail[wd] !== false) && !has(p.id, ds) && !pendingOff(p.id, ds) && (!(p.maxHours > 0) || weekH(p.id, ds) + th <= p.maxHours + 1e-9) && restOk(p.id, ds, t) && consecOk(p.id, ds))

        if (!cands.length) { unfilled += n - have; break; }
        const sh = { id: uid('sh'), date: ds, staffId: cands[0].id, kind: 'work', start: t.start, end: t.end, brk: t.brk, tpl: t.id, note: '' };
        pool.push(sh); ops.push({ id: sh.id, before: null, after: sh }); have++;
      }
    }
  }

}

// ---------- payroll ----------
function payPeriod(ym) {

  else { from = new Date(y, m - 2, cd + 1); to = new Date(y, m - 1, cd); }
  const pm = new Date(to.getFullYear(), to.getMonth() + (Number(c.payMonthOffset) || 0), 1);
  const pay = new Date(pm.getFullYear(), pm.getMonth(), Math.min(Number(c.payDay) || 25, lastDay(pm.getFullYear(), pm.getMonth())));

}

  const total = Math.max(0, base + nightPay + otPay + transport + allowance + extra - deduct);
  const bank = pr.bank; const bankOk = !!(bank.bankCode && bank.branchCode && bank.number && bank.holder);
  return { days: days.size, hrs, night, ot, base, nightPay, otPay, transport, allowance, extra, deduct, total, bank, bankOk, wage: pr.wage, note: adj.note || '' };
}

  const st = settings(); const r = view === 'week' || view === 'day' ? (() => { const a = startOfWeek(cur, st.weekStart); return { from: fmtD(a), to: fmtD(addD(a, 6)) }; })() : visibleRange();
  const inR = Object.values(S.shifts).filter(s => s.date >= r.from && s.date <= r.to && S.staff[s.staffId]).sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start);
  const text = () => {
    const lines = [`【${st.storeName} シフト ${dayLabel(r.from)}〜${dayLabel(r.to)}】`];
    for (let d = parseD(r.from); fmtD(d) <= r.to; d = addD(d, 1)) {
      const ds = fmtD(d); const day = inR.filter(s => s.date === ds); lines.push('', `■ ${dayLabel(ds)}${HOLIDAYS[ds] && st.showHolidays ? ' ' + HOLIDAYS[ds] : ''}`);
      if (!day.length) { lines.push('　（シフトなし）'); continue; }
      const groups = [...st.templates.map(t => ({ name: t.name, list: day.filter(s => s.kind === 'work' && s.tpl === t.id) })), { name: 'その他', list: day.filter(s => s.kind === 'work' && !tplOf(s.tpl)) }];
      groups.forEach(g => { if (g.list.length) lines.push(`　${g.name}：` + g.list.map(s => `${S.staff[s.staffId].name}(${mmToStr(s.start)}-${mmToStr(s.end)})`).join('、')); });
      const off = day.filter(s => s.kind === 'off'); if (off.length) lines.push('　希望休：' + off.map(s => S.staff[s.staffId].name).join('、'));
    }
    return lines.join('\n');
  };
  const csv = () => { const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"'; const rows = [['日付', '曜日', 'スタッフ', '役割', '種類', '区分', '開始', '終了', '休憩(分)', '実働(h)', 'メモ'].map(esc).join(',')]; inR.forEach(s => { const p = S.staff[s.staffId]; rows.push([s.date, WD[parseD(s.date).getDay()], p.name, p.role, s.kind === 'work' ? '勤務' : '希望休', s.kind === 'work' ? (tplOf(s.tpl)?.name || '自由入力') : '', s.kind === 'work' ? mmToStr(s.start) : '', s.kind === 'work' ? mmToStr(s.end) : '', s.kind === 'work' ? s.brk : '', s.kind === 'work' ? fmtH(hours(s)) : '', s.note].map(esc).join(',')); }); return '﻿' + rows.join('\r\n'); };
  const ta = h('textarea', { id: 'shareText', readonly: true }, text());
  const copyBtn = h('button', { type: 'button', class: 'btn primary', onclick: async () => { try { await navigator.clipboard.writeText(ta.value); toast('コピーしました', 'ok'); } catch (e) { ta.focus(); ta.select(); toast('選択したテキストをコピーしてください'); } } }, 'テキストをコピー');
  const csvBtn = h('button', { type: 'button', class: 'btn', onclick: async () => { const data = csv(); if (downloads) { try { await downloads.save({ filename: `shift_${r.from}_${r.to}.csv`, data }); toast('CSV を保存しました', 'ok'); return; } catch (e) { if (e && e.code === 'declined') return; } } ta.value = data; ta.focus(); ta.select(); toast('CSV の内容を表示しました。コピーして .csv で保存してください'); } }, 'CSV（Excel 用）');
  openModal(h('div', { style: 'display:contents' }, h('h2', null, '共有・書き出し'), h('p', { class: 'hint', style: 'margin:0' }, `${dayLabel(r.from)}〜${dayLabel(r.to)} の内容です。LINE やメールにそのまま貼れる形になっています。`), ta,
    h('div', { class: 'foot' }, h('button', { type: 'button', class: 'btn left', onclick: () => { ta.value = text(); } }, 'テキストに戻す'), csvBtn, h('button', { type: 'button', class: 'btn', onclick: closeModal }, '閉じる'), copyBtn)));
}

// ---------- actions ----------
async function runAuto() {
  if (!canWrite()) return; if (!staffList().length) { toast('先にスタッフを登録してください'); return; }
  const r = visibleRange();
  const { ops, unfilled } = autoAssignPlan(r.from, r.to);
  if (!ops.length) { toast(unfilled ? `埋められる候補がいません（${unfilled} 枠が不足のまま）` : '不足している枠はありません', unfilled ? 'bad' : 'ok'); return; }
  if (!await confirmBox('自動割当', `${dayLabel(r.from)}〜${dayLabel(r.to)} の不足枠に ${ops.length} 件のシフトを追加します。` + (unfilled ? ` ${unfilled} 枠は条件に合う人がいないため残ります。` : '') + ' 既存のシフトと申請中の休み希望は避けます。', '追加する')) return;
  commit('自動割当', ops); toast(`${ops.length} 件を割り当てました（Ctrl+Z で戻せます）`, 'ok');
}
async function copyPrevWeek() {
  if (!canWrite()) return; const r = visibleRange(); const pf = fmtD(addD(parseD(r.from), -7)), pt = fmtD(addD(parseD(r.to), -7));
  const src = Object.values(S.shifts).filter(s => s.date >= pf && s.date <= pt && S.staff[s.staffId]);
  if (!src.length) { toast('前の週にシフトがありません'); return; }
  const ops = []; src.forEach(s => { const date = fmtD(addD(parseD(s.date), 7)); if (Object.values(S.shifts).some(x => x.staffId === s.staffId && x.date === date)) return; const c = { ...s, id: uid('sh'), date }; ops.push({ id: c.id, before: null, after: c }); });
  if (!ops.length) { toast('すでに同じ日にシフトがあるため、複製するものがありません'); return; }
  if (!await confirmBox('前週コピー', `${dayLabel(pf)}〜${dayLabel(pt)} のシフト ${ops.length} 件をこの週に複製します。すでにシフトがある人の日は飛ばします。`, '複製する')) return;
  commit('前週コピー', ops); toast(`${ops.length} 件を複製しました`, 'ok');
}
async function loadSample() {
  if (!canWrite()) return;
  const names_ = [['佐藤 美咲', '社員', 1400, 40], ['田中 健太', '社員', 1350, 40], ['鈴木 さくら', 'アルバイト', 1150, 25], ['高橋 大輔', 'アルバイト', 1150, 30], ['伊藤 結衣', 'アルバイト', 1100, 20], ['渡辺 翔', 'パート', 1200, 32]];
  const avails = [[true, true, true, true, true, true, true], [true, true, true, true, true, true, true], [true, false, true, false, true, true, true], [true, true, true, true, true, false, false], [true, false, false, true, true, true, true], [false, true, true, true, true, true, false]];
  const ps = names_.map(([name, role_, wage, maxHours], i) => ({ p: { id: uid('st'), name, role: role_, color: PALETTE[i], maxHours, avail: avails[i], memo: 'サンプル', order: i }, wage }));
  for (const { p, wage } of ps) { S.staff[p.id] = p; S.payroll[p.id] = { ...EMPTY_PAY(), wage }; try { await writeDoc('staff/' + p.id, p); await writeDoc('payroll/' + p.id, S.payroll[p.id]); } catch (e) { writeErr(e); return; } }
  if (!S.settings) await saveSettings(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)));
  const w = startOfWeek(cur, settings().weekStart); const r = { from: fmtD(addD(w, -7)), to: fmtD(addD(w, 13)) };
  const offs = [{ id: uid('sh'), date: fmtD(addD(w, 2)), staffId: ps[2].p.id, kind: 'off', start: 0, end: 0, brk: 0, tpl: '', note: '試験' }, { id: uid('sh'), date: fmtD(addD(w, 5)), staffId: ps[4].p.id, kind: 'off', start: 0, end: 0, brk: 0, tpl: '', note: '' }];
  for (const o of offs) S.shifts[o.id] = o;
  const { ops } = autoAssignPlan(r.from, r.to);
  const all = offs.map(o => ({ id: o.id, before: null, after: o })).concat(ops);
  for (const op of ops) S.shifts[op.id] = op.after;
  render(); await persistShiftOps(all, 'after'); toast(`サンプルのスタッフ ${ps.length} 人とシフト ${all.length} 件を入れました`, 'ok');
}
function toast(msg, kind) { const t = h('div', { class: 'toast' + (kind ? ' ' + kind : '') }, msg); $('#toasts').append(t); setTimeout(() => t.remove(), 3200); }
function shiftPeriod(n) { if (view === 'week') cur = addD(cur, 7 * n); else if (view === 'day') cur = addD(cur, n); else cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1); render(); }

// ---------- wiring ----------
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.view; render(); });
$('#prevBtn').onclick = () => shiftPeriod(-1); $('#nextBtn').onclick = () => shiftPeriod(1);
$('#todayBtn').onclick = () => { cur = new Date(); cur.setHours(0, 0, 0, 0); render(); };
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo; $('#autoBtn').onclick = runAuto; $('#copyPrevBtn').onclick = copyPrevWeek; $('#shareBtn').onclick = openShareDialog;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); return; }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) && !typing) { e.preventDefault(); redo(); }
  else if (!typing && !modalEl && $('#period').hidden === false && e.key === 'ArrowLeft') shiftPeriod(-1);
  else if (!typing && !modalEl && $('#period').hidden === false && e.key === 'ArrowRight') shiftPeriod(1);
});
try { window.claude?.hot?.snapshot?.(() => ({ view, cur: fmtD(cur), payYm })); } catch (e) { }

// Names of request senders, for the owner's 本人確認 row. Only ids are stored; names resolve at render time.
let nameKey = '';
async function resolveNames() {
  if (!userApi) return; const ids = new Set(Object.keys(S.requests)); Object.values(S.staff).forEach(p => { if (p.userId) ids.add(p.userId); });
  const key = [...ids].sort().join(','); if (!ids.size || key === nameKey) return; nameKey = key;
  try { const ps = await userApi.profiles([...ids]); let changed = false; for (const id in ps) { const n = ps[id].name || ''; if (names[id] !== n) { names[id] = n; changed = true; } } if (changed) render(); } catch (e) { }
}
async function boot(hot) {
  if (hot && hot.view) { view = hot.view; if (hot.cur) cur = parseD(hot.cur); if (hot.payYm) payYm = hot.payYm; }
  render();
  const use = window.claude && window.claude.use;
  if (use) {
    const d = await window.claude.use('db');
    if (d) {
      db = d; backend = 'db';
      userApi = await window.claude.use('user');
      if (userApi) {
        try { const owner = await userApi.isOwner(); me = await userApi.id(); role = owner ? 'owner' : 'staff'; } catch (e) { role = 'owner'; }
      } else role = 'owner';
      window.claude.use('downloads').then(x => { downloads = x; render(); });
      db.doc('settings/main').onSnapshot(snap => { const d2 = snap.exists ? snap.data() : null; S.settings = d2 ? { ...DEFAULT_SETTINGS, ...d2, templates: d2.templates || DEFAULT_SETTINGS.templates, required: d2.required || DEFAULT_SETTINGS.required } : null; render(); }, err => console.error(err));
      db.collection('staff').onSnapshot(qs => { const next = {}; qs.docs.forEach(x => { next[x.id] = { id: x.id, ...x.data() }; }); S.staff = next; render(); resolveNames(); }, err => console.error(err));
      if (role === 'owner') {
        db.collection('payroll').onSnapshot(qs => { const next = {}; let comp = null; qs.docs.forEach(x => { if (x.id === '_company') comp = x.data(); else if (!x.id.startsWith('_')) next[x.id] = x.data(); }); S.payroll = next; S.company = comp; render(); }, err => console.error(err));
        db.collection('requests').onSnapshot(qs => { const next = {}; qs.docs.forEach(x => { next[x.id] = x.data(); }); S.requests = next; render(); resolveNames(); }, err => console.error(err));
      } else if (me) {
        db.doc('requests/' + me).onSnapshot(snap => { S.myReq = snap.exists ? snap.data() : null; render(); }, err => console.error(err));
      }
      ensureShiftSub(); updateUndo(); return;
    }
    window.claude.use('downloads').then(x => { downloads = x; render(); });
  }
  loadLocal(); S.ready = true; render(); updateUndo();
}
if (location.protocol === 'file:') window.__sb = { toBankKana, zenginFile, calcPay, payPeriod, S, company, setPayYm: v => { payYm = v; }, render: () => render(), setView: v => { view = v; render(); } };
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});
})();
